name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'  # Trigger only on version tags e.g. v1.0.0, v1.2.3

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Create 404.html for GitHub Pages
        run: cp dist/ms-sarker/browser/index.html dist/ms-sarker/browser/404.html

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # this should match the default output path in angular.json
          path: dist/ms-sarker/browser/

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<section class="page-hero-bs">
  <div class="container-xl position-relative" style="z-index:2;">
    <span class="eyebrow"><i class="bi bi-people"></i>Clients</span>
    <h1 class="display-4 section-title">Valued <span class="text-warning">Clients</span></h1>
    <p class="section-lead">Organizations across Bangladesh that trust M/S SARKER for electrical safety and energy work.</p>
  </div>
</section>

<div class="container-xl section-shell">
  <div class="row g-4 justify-content-center">
    <div class="col-md-6 col-lg-4" *ngFor="let client of clients">
      <a
        class="professional-card client-card p-4 d-flex align-items-center gap-3 card-hover"
        [href]="client.website"
        target="_blank"
        rel="noopener noreferrer"
        [attr.aria-label]="'Visit ' + client.name + ' website'">
        <span class="client-logo">
          <img [src]="client.logoUrl" [alt]="client.name + ' logo'" loading="lazy">
        </span>
        <span class="client-name">{{ client.name }}</span>
        <i class="bi bi-box-arrow-up-right client-link-icon"></i>
      </a>
    </div>
  </div>

  <div class="mt-5 ticker-wrap overflow-hidden table-shell py-4">
    <div class="ticker-inner d-flex gap-5 align-items-center">
      <div *ngFor="let client of clients" class="client-ticker-item text-nowrap px-4">
        {{ client.name.toUpperCase() }}
      </div>
      <div *ngFor="let client of clients" class="client-ticker-item text-nowrap px-4">
        {{ client.name.toUpperCase() }}
      </div>
    </div>
  </div>
</div>

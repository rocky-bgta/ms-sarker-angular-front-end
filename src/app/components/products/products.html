<section class="page-hero-bs py-5">
  <div class="container-xl position-relative" style="z-index:2;">
    <h1 class="display-4 fw-bold text-white mb-2" style="font-family:'Oswald',sans-serif;letter-spacing:2px;">OUR <span class="text-warning">PRODUCTS</span></h1>
    <p class="text-secondary mb-0" style="letter-spacing:1px;max-width:600px;">Explore our range of certified lightning protection, renewable energy, and electrical safety solutions.</p>
  </div>
</section>

<div class="container-xl py-5">
  <div class="row g-4">
    <div class="col-md-6 col-lg-4" *ngFor="let p of products">
      <div class="card h-100 bg-dark border-secondary border-opacity-25 card-hover rounded-4 overflow-hidden">
        <div class="card-body p-4">
          <div class="d-flex align-items-center gap-3 mb-4">
            <div class="rounded-circle d-flex align-items-center justify-content-center bg-warning bg-opacity-10 border border-warning border-opacity-25" style="width:56px;height:56px;">
              <span style="font-size:1.8rem;">{{ p.icon }}</span>
            </div>
            <div>
              <div class="text-warning fw-bold small text-uppercase mb-1" style="letter-spacing:2px;font-size:0.65rem;">{{ p.category }}</div>
              <h5 class="card-title text-white mb-0" style="font-family:'Oswald',sans-serif;letter-spacing:1px;">{{ p.name }}</h5>
            </div>
          </div>
          <p class="card-text text-secondary mb-4" style="font-size:0.9rem;line-height:1.6;">{{ p.description }}</p>

          <div class="mb-4">
            <div class="fw-bold text-white small mb-2" style="letter-spacing:1px;">AUTHORIZED BRANDS:</div>
            <div class="d-flex flex-wrap gap-2">
              <span class="badge bg-secondary bg-opacity-15 text-white-50 border border-secondary border-opacity-25 fw-normal" *ngFor="let b of p.brands">{{ b }}</span>
            </div>
          </div>

          <div>
            <div class="fw-bold text-white small mb-2" style="letter-spacing:1px;">SPECIFICATIONS:</div>
            <ul class="list-unstyled mb-0">
              <li class="text-secondary mb-1 d-flex align-items-start gap-2" style="font-size:0.85rem;" *ngFor="let s of p.specs">
                <i class="bi bi-check2 text-warning"></i><span>{{ s }}</span>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

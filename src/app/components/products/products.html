<section class="page-hero-bs">
  <div class="container-xl position-relative" style="z-index:2;">
    <span class="eyebrow"><i class="bi bi-box-seam"></i>Solutions</span>
    <h1 class="display-4 section-title">Our <span class="text-warning">Products</span></h1>
    <p class="section-lead">Certified lightning protection, renewable energy, and electrical safety solutions for commercial and industrial sites.</p>
  </div>
</section>

<div class="container-xl section-shell">
  <div class="row g-4">
    <div class="col-md-6 col-lg-4" *ngFor="let p of products">
      <div class="card product-card professional-card card-hover overflow-hidden">
        <div class="product-media">
          <img
            [src]="getProductImage(p)"
            [alt]="p.name"
            loading="lazy"
            (error)="handleProductImageError($event)">
          <span class="product-media-fallback">
            <i class="bi" [ngClass]="getProductIcon(p)"></i>
          </span>
        </div>
        <div class="card-body p-4">
          <div class="d-flex align-items-center gap-3 mb-4">
            <div class="icon-frame product-icon">
              <i class="bi" [ngClass]="getProductIcon(p)"></i>
            </div>
            <div>
              <div class="meta-label mb-1">{{ p.category }}</div>
              <h5 class="card-title product-title mb-0">{{ p.name }}</h5>
            </div>
          </div>
          <ng-container *ngFor="let section of getSectionOrder(p); let isLast = last">
            <div [ngSwitch]="section" [ngClass]="{'mb-4': !isLast, 'mb-0': isLast}">
              <div *ngSwitchCase="'description'">
                <p class="card-text text-secondary product-copy mb-0">{{ p.description }}</p>
              </div>

              <div *ngSwitchCase="'brands'">
                <div class="meta-label mb-2">Authorized Brands</div>
                <div class="d-flex flex-wrap gap-2">
                  <span class="soft-badge px-3" *ngFor="let b of p.brands">{{ b }}</span>
                </div>
              </div>

              <div *ngSwitchCase="'specs'">
                <div class="meta-label mb-2">Specifications</div>
                <ul class="list-unstyled mb-0">
                  <li class="text-secondary mb-2 d-flex align-items-start gap-2 product-spec" *ngFor="let s of p.specs">
                    <i class="bi bi-check2 text-warning"></i><span>{{ s }}</span>
                  </li>
                </ul>
              </div>
            </div>
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</div>

<button class="ask-float" (click)="toggle()" [class.is-open]="isOpen()" aria-label="Ask AI assistant">
  <svg class="ask-star" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 2l2.09 6.41L20.5 10l-6.41 2.09L12 18.5l-2.09-6.41L3.5 10l6.41-2.09L12 2z"/>
    <circle cx="5" cy="5" r="1.2" opacity="0.6"/>
    <circle cx="19" cy="19" r="0.9" opacity="0.5"/>
  </svg>
  <span>Ask</span>
</button>

@if (isOpen()) {
  <div class="chat-panel">
    <div class="chat-header">
      <div class="header-title">
        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
          <path d="M12 2l2.09 6.41L20.5 10l-6.41 2.09L12 18.5l-2.09-6.41L3.5 10l6.41-2.09L12 2z"/>
        </svg>
        <span>M/S Sarker Assistant</span>
      </div>
      <button class="close-btn" (click)="toggle()" aria-label="Close">✕</button>
    </div>

    <div class="chat-messages" #messagesEl>
      @for (msg of messages(); track $index) {
        <div class="message" [class.user-msg]="msg.role === 'user'" [class.bot-msg]="msg.role === 'bot'">
          {{ msg.text }}
        </div>
      }
      @if (isTyping()) {
        <div class="message bot-msg typing-indicator">
          <span></span><span></span><span></span>
        </div>
      }
    </div>

    @if (messages().length <= 1) {
      <div class="suggestions">
        @for (s of suggestions; track s) {
          <button class="chip" (click)="send(s)">{{ s }}</button>
        }
      </div>
    }

    <div class="chat-input-row">
      <input
        class="chat-input"
        [(ngModel)]="userInput"
        placeholder="Ask anything about this page..."
        (keydown.enter)="send()"
        autocomplete="off"
      />
      <button class="send-btn" (click)="send()" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="white" width="16" height="16">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </div>
}

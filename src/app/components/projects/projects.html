<section class="page-hero-bs">
  <div class="container-xl position-relative" style="z-index:2;">
    <span class="eyebrow"><i class="bi bi-kanban"></i>Track Record</span>
    <h1 class="display-4 section-title">Major <span class="text-warning">Projects</span></h1>
    <p class="section-lead">Successful installations and engineering milestones across Bangladesh.</p>
  </div>
</section>

<div class="container-xl section-shell">
  <div class="table-responsive table-shell projects-table-shell">
    <table class="table table-dark table-hover mb-0 align-middle projects-table">
      <thead>
        <tr>
          <th class="ps-4 py-3">YEAR</th>
          <th class="py-3">PROJECT TITLE</th>
          <th class="py-3">CATEGORY</th>
          <th class="py-3">LOCATION</th>
          <th class="py-3 text-center">IoT</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of projects" class="border-secondary border-opacity-10">
          <td class="ps-4 text-warning fw-bold">{{ p.year }}</td>
          <td>
            <div class="text-white fw-semibold">{{ p.title }}</div>
            <div class="text-secondary small d-flex gap-2 mt-1">
              <span>{{ p.brand }}</span>&middot;<span>{{ p.qty }}</span>
            </div>
          </td>
          <td><span class="soft-badge px-3">{{ p.type }}</span></td>
          <td class="text-secondary small">{{ p.location }}</td>
          <td class="text-center">
            <i *ngIf="p.iot" class="bi bi-broadcast text-success" title="IoT Enabled"></i>
            <span *ngIf="!p.iot" class="text-muted small">—</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

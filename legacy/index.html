<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M/S SARKER — Quality Supplier & Contractor</title>
  <meta name="description" content="M/S SARKER — Advanced electrical safety, lightning protection, and renewable energy solutions in Bangladesh.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>⚡</text></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Animate.css -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">

  <style>
    :root {
      --bs-body-bg: #0d1117;
      --bs-body-color: #e8ebf0;
      --bs-dark: #0d1117;
      --bs-dark-rgb: 13,17,23;
      --bs-warning: #f5a623;
      --bs-warning-rgb: 245,166,35;
    }
    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0d1117; color: #e8ebf0; overflow-x: hidden; }

    /* NAV */
    .navbar { transition: all .3s; }
    .navbar-dark .navbar-nav .nav-link { color: rgba(255,255,255,.6); transition: all .2s; }
    .navbar-dark .navbar-nav .nav-link:hover,
    .navbar-dark .navbar-nav .nav-link.active { color: #f5a623; background: rgba(245,166,35,.1); }
    .navbar-dark .navbar-brand { font-family: 'Oswald', sans-serif; }

    /* PAGE OFFSET */
    #app { padding-top: 72px; }

    /* HERO GRID */
    .hero-grid-overlay {
      position:absolute; inset:0;
      background-image: linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
                        linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center,black 40%,transparent 80%);
      pointer-events:none;
    }

    /* CARD HOVER */
    .card-hover { transition: transform .25s, border-color .25s, box-shadow .25s; cursor: default; }
    .card-hover:hover { transform: translateY(-4px); border-color: rgba(245,166,35,.35)!important; box-shadow: 0 8px 32px rgba(245,166,35,.12)!important; }

    /* PAGE HERO */
    .page-hero-bs {
      background: linear-gradient(135deg,#0d1117 0%,#161b22 100%);
      border-bottom: 1px solid rgba(245,166,35,.15);
      position: relative; overflow: hidden;
    }
    .page-hero-bs::before {
      content:''; position:absolute; inset:0;
      background-image: linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
                        linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
      background-size:60px 60px;
      mask-image:radial-gradient(ellipse at 0% 50%,black 40%,transparent 80%);
    }

    /* TICKER */
    .ticker-wrap { padding: 12px 0; }
    .ticker-inner { animation: ticker 40s linear infinite; width: max-content; }
    .marquee-inner { animation: ticker 25s linear infinite; width: max-content; }
    @keyframes ticker { from{transform:translateX(0)} to{transform:translateX(-50%)} }

    /* SCROLL BOUNCE */
    .scroll-bounce { animation: bounce 2s ease infinite; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(8px)} }

    /* FORM DARK THEME OVERRIDES */
    .form-control.bg-dark, .form-select.bg-dark {
      background-color: #161b22 !important;
      border-color: rgba(255,255,255,.15) !important;
      color: #e8ebf0 !important;
    }
    .form-control.bg-dark:focus, .form-select.bg-dark:focus {
      border-color: rgba(245,166,35,.5) !important;
      box-shadow: 0 0 0 3px rgba(245,166,35,.15) !important;
      background-color: #1a1f2e !important;
    }
    .form-control.bg-dark::placeholder { color: rgba(255,255,255,.3); }
    .form-control.bg-dark.is-valid, .form-select.bg-dark.is-valid {
      border-color: #25d366 !important;
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3e%3cpath fill='%2325d366' d='m2.3 6.73.06-.06 1.18-1.35L7.6 2 8 2.4 3.55 7.67l-.18.19-.09-.07L1 5.47l.4-.4z'/%3e%3c/svg%3e");
    }
    .form-control.bg-dark.is-invalid, .form-select.bg-dark.is-invalid {
      border-color: #e8303a !important;
    }
    .invalid-feedback { font-size: 0.8rem; }
    .valid-feedback   { font-size: 0.8rem; color: #25d366; }
    .form-select.bg-dark option { background: #161b22; color: #e8ebf0; }

    /* ADMIN */
    .admin-layout { min-height: calc(100vh - 72px); }
    .admin-sidebar { position: sticky; top: 72px; height: calc(100vh - 72px); overflow-y: auto; }
    .accordion-button::after { filter: invert(1); }
    .accordion-button:not(.collapsed) { background: rgba(245,166,35,.08)!important; color: #f5a623!important; }
    .accordion-button.collapsed { color: #e8ebf0!important; }

    /* SweetAlert dark overrides */
    .swal2-popup { font-family: 'Inter', sans-serif !important; }

    /* FOOTER */
    footer a { transition: color .2s; }
    footer a:hover { color: #f5a623 !important; }

    /* Loading */
    #pageLoader { font-family: 'Oswald',sans-serif; }
  </style>
</head>
<body>

<div id="pageLoader" class="position-fixed inset-0 d-flex align-items-center justify-content-center flex-column gap-3"
     style="inset:0;background:#0d1117;z-index:9999;transition:opacity .4s;">
  <div style="font-size:3rem;animation:spin 2s linear infinite;display:inline-block;">⚡</div>
  <div class="text-secondary" style="font-size:0.75rem;letter-spacing:3px;">LOADING M/S SARKER…</div>
</div>

<div id="app">
  <div id="nav-slot"></div>
  <main id="view"></main>
  <div id="footer-slot"></div>
</div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>

  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>

  <script src="./js/app.bundle.js"></script>
</body>
</html>
